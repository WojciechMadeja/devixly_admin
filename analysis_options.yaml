include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/app_localizations*.dart
    # Kod FlutterFlow — usuwany w Fazie 7 migracji (MIGRATION_PLAN.md).
    # Do tego czasu nie podlega regułom nowej architektury.
    - lib/actions/**
    - lib/auth/**
    - lib/backend/**
    - lib/components/**
    - lib/custom_code/**
    - lib/flutter_flow/**
    - lib/pages/**
    - lib/app_state.dart
    - lib/index.dart
    - lib/main.dart
    - test/goldens/baseline_capture/**
    - test/widget_test.dart
  errors:
    # @JsonKey na parametrach konstruktorów freezed.
    invalid_annotation_target: ignore

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    prefer_single_quotes: true
    unawaited_futures: true
